<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Polyfills -->
  <script src="https://wzrd.in/standalone/formdata-polyfill"></script>
  <script src="https://wzrd.in/standalone/promise-polyfill@latest"></script>
  <script src="https://wzrd.in/standalone/whatwg-fetch@latest"></script>
</head>

<body>

<form name="submit-to-google-sheet" id="form">
  <div id="error" style="color:red;"></div>

  <div class="group">
    <input id="name" name="fullName" type="text" placeholder="Full Name" required>
  </div>

  <div class="group">
    <input id="email" name="email" type="email" placeholder="Email Address" required>
  </div>

  <div class="group">
    <input id="phone" name="phone" type="text" placeholder="Phone Number" required>
  </div>

  <div class="group">
    <button type="submit">Download Agenda</button>
  </div>
</form>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbyc9qhRfihzMfhQw59UdRcIsPMTxgMeeG8dFN0tBhO_xPk6Xysb_FLrV9mB7F13hO1y/exec'
const form = document.forms['submit-to-google-sheet']
const errorElement = document.getElementById('error')

form.addEventListener('submit', e => {
  e.preventDefault()
  errorElement.textContent = ''

  fetch(scriptURL, {
    method: 'POST',
    body: new FormData(form)
  })
  .then(() => {
    window.location.href = 'thankyou.html'
  })
  .catch(err => {
    errorElement.textContent = 'Submission failed. Please try again.'
    console.error(err)
  })
})
</script>

</body>
</html>
