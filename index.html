
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Polyfills -->
  <script src="https://wzrd.in/standalone/formdata-polyfill"></script>
  <script src="https://wzrd.in/standalone/promise-polyfill@latest"></script>
  <script src="https://wzrd.in/standalone/whatwg-fetch@latest"></script>
</head>

<body>

<form id="form" name="submit-to-google-sheet">
  <div id="error" style="color:red;"></div>

  <div class="group">
    <input name="fullName" type="text" placeholder="Full Name" required>
  </div>

  <div class="group">
    <input name="email" type="email" placeholder="Email Address" required>
  </div>

  <div class="group">
    <input name="phone" type="text" placeholder="Phone Number" required>
  </div>

  <div class="group">
    <button type="submit">Submit</button>
  </div>
</form>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbwOGWEajpfmI9uruNEDqZQktNkSh_mrbKmPyLXLx5xmUucuFXr0hFLtOtMbRi04EVNN/exec'
const form = document.getElementById('form')
const error = document.getElementById('error')

form.addEventListener('submit', e => {
  e.preventDefault()
  error.textContent = ''

  fetch(scriptURL, {
    method: 'POST',
    body: new FormData(form)
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert('Submitted successfully!')
      form.reset()
    } else {
      error.textContent = 'Submission failed.'
    }
  })
  .catch(err => {
    error.textContent = 'Submission failed.'
    console.error(err)
  })
})
</script>

</body>
</html>
