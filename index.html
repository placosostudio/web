<html lang="en">
<head>
 
  <!-- Polyfills -->
  <script src="https://wzrd.in/standalone/formdata-polyfill"></script>
  <script src="https://wzrd.in/standalone/promise-polyfill@latest"></script>
  <script src="https://wzrd.in/standalone/whatwg-fetch@latest"></script>
</head>

<body>

<form name="submit-to-google-sheet" id="form">
  <div id="error" style="color:red;"></div>

  <div class="group">
    <input id="name" name="fullName" type="text" placeholder="Full Name" required>
  </div>

  <div class="group">
    <input id="email" name="email" type="email" placeholder="Email Address" required>
  </div>

  <div class="group">
    <input id="phone" name="phone" type="text" placeholder="Phone Number" required>
  </div>

  <div class="group">
    <button type="submit">submit</button>
  </div>
</form>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbyc9qhRfihzMfhQw59UdRcIsPMTxgMeeG8dFN0tBhO_xPk6Xysb_FLrV9mB7F13hO1y/exec'
 
form.addEventListener('submit', e => {
  e.preventDefault()
 

  fetch(scriptURL, {
    method: 'POST',
    body: new FormData(form)
  })
  
  
})
</script>

</body>
</html>
